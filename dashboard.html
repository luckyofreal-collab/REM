<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="ui.css"><title>REM dashboard</title></head><body><main class="shell"><header class="head"><img src="assets/mascot.svg"><div><h1>REM dashboard</h1><p>Keep your plans gentle, clear, and yours.</p></div><button id="backup" class="secondary" style="margin-left:auto">Export backup</button><button id="restore" class="secondary">Restore</button><input id="file" type="file" accept="application/json" hidden></header><div class="layout"><section><div class="panel"><h2>Create a task</h2><form id="task-form" class="form"><label>Task<input name="title" maxlength="180" required></label><label>Notes<textarea name="notes"></textarea></label><div class="row"><label>Due date<input name="due" type="datetime-local" required></label><label>Priority<select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>critical</option></select></label></div><label>Repeat<select name="frequency"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="weekdays">Custom weekdays</option></select></label><div class="daychecks" id="days"></div><button>Create task</button></form></div><div class="panel"><h2>Preferences</h2><form id="settings" class="form"><div class="settings-grid"><label>Quiet hours begin<input name="quietStart" type="time"></label><label>Quiet hours end<input name="quietEnd" type="time"></label><label>Mascot size <span id="size-label"></span><input name="mascotSize" type="range" min="64" max="180"></label><label>Personality<select name="personality"><option value="adaptive">Adaptive</option><option value="calm">Calm</option><option value="bright">Bright</option><option value="concise">Concise</option></select></label><label>Dialogue<select name="dialogue"><option value="hybrid">Adaptive bubble + panel</option><option value="bubble">Bubble</option><option value="panel">Panel</option></select></label><label><span>Optional notification sound</span><input name="sound" type="checkbox"></label></div><button>Save preferences</button></form><p class="meta">Mascot art can be replaced later at <code>assets/mascot.svg</code>. Page overlays are skipped on browser-internal and restricted pages.</p></div></section><section><div class="panel"><h2>Tasks</h2><div class="toolbar"><button data-filter="all" class="secondary">All</button><button data-filter="active" class="secondary">Active</button><button data-filter="pending" class="secondary">Not started</button><button data-filter="completed" class="secondary">Completed</button></div><div id="tasks"></div></div><div class="panel"><h2>Reminder inbox <button id="clear-inbox" class="secondary" style="float:right">Mark all read</button></h2><div id="inbox"></div></div></section></div></main><script src="dashboard.js"></script></body></html>
