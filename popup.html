<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="ui.css"><title>REM</title><style>body{width:380px;max-height:600px;overflow:auto}.shell{padding:18px}.layout{display:block}.panel{margin-bottom:12px}.task-actions button{font-size:11px}</style></head><body><main class="shell"><header class="head"><img src="assets/mascot.svg"><div><h1>REM</h1><p>A little space for what matters.</p></div><button id="dashboard" class="secondary" style="margin-left:auto">Open</button></header><section class="panel"><h2>Add a reminder</h2><form id="task-form" class="form"><label>What needs doing?<input name="title" required maxlength="180" placeholder="A small, clear next step"></label><div class="row"><label>When<input name="due" type="datetime-local" required></label><label>Priority<select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>critical</option></select></label></div><details><summary>More details</summary><label>Notes<textarea name="notes"></textarea></label><label>Repeat<select name="frequency"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="weekdays">Choose weekdays</option></select></label><div class="daychecks" id="days"></div></details><button>Add task</button></form></section><section class="panel"><h2>Up next</h2><div id="tasks"></div></section></main><script src="popup.js"></script></body></html>
